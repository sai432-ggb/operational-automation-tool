application:
  name: "Operational Automation Tool"
  version: "1.0.0"
  environment: "development"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_path: "data/logs/app.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5

data_cleaner:
  enabled: true
  input_path: "data/input"
  output_path: "data/output/cleaned"
  rules:
    remove_duplicates: true
    handle_missing_values: "drop"  # Options: drop, fill, interpolate
    validate_data_types: true
    outlier_detection: true
    outlier_method: "iqr"  # Options: iqr, zscore
  file_patterns:
    - "*.csv"
    - "*.xlsx"
    - "*.json"

report_generator:
  enabled: true
  output_path: "data/output/reports"
  format: "pdf"  # Options: pdf, html, excel
  template_path: "templates"
  schedule:
    enabled: true
    frequency: "daily"  # Options: daily, weekly, monthly
    time: "09:00"
  include_sections:
    - summary
    - detailed_analysis
    - visualizations
    - recommendations

system_health:
  enabled: true
  check_interval: 300  # seconds
  thresholds:
    cpu_percent: 80
    memory_percent: 85
    disk_percent: 90
  monitored_processes:
    - "python"
    - "postgres"
  alert_on_failure: true

email_notifications:
  enabled: true
  smtp:
    host: "smtp.gmail.com"
    port: 587
    use_tls: true
  recipients:
    - "admin@example.com"
  send_on:
    - "error"
    - "completion"
    - "health_alert"

database:
  enabled: false
  type: "sqlite"
  path: "data/automation.db"